<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-From</title>
    <link rel="stylesheet" href="user-form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

</head>
<body>
    <div class="bg-container">
        <h1 class="heading">Add User</h1>
        <form id="myFrom">
            <div class="mb-3">
                <label class="label-text" for="name">Name</label><br/>
                <input type="text" class="form-control" id="name" /> <br/>
                <p class="error-Msg" id="nameErrorMsg"></p>
            </div>

            <div class="mb-3">
                <label class="label-text" for="email">Email</label><br/>
                <input type="email" class="form-control" id="email" /><br/>
                <p class="error-Msg" id="emailErrorMsg"></p>
            </div>
            <div class="mb-3">
                <label class="status-text" for="status">Working Status</label>
                <select id="status" class="form-control">
                    <option value="Active">Active</option>
                    <option value="Inactive" selected>Inactive</option>
                </select>
            </div>

            <div class="mb-3">
                <h1 class="gender-text">Gender</h1>
                <label for="genderMale">
                    Male
                </label>
                <input type="radio" id="genderMale" value="Male" name="gender" class="mr-2" />
                <label for="genderFemale">Female</label>
                <input type="radio" id="genderFemale" value="Female" name="gender" checked/>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
    <script type="text/javascript" src="user.form.js"></script>
</body>
</html>
