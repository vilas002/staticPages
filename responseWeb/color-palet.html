<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="color-palet.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <title>Collar-palet</title>
</head>
<body>
    <h1 class="main-heading">Color Pallet</h1>
    <div class="container">
        <div class="row">
            <div class="box bg-primary mb-3  col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>Primary</p>
            </div>
            <div class="box bg-secondary mb-3 col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>Secondary</p>
            </div>
            <div class="box bg-success mb-3 col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>Success</p>
            </div>
            <div class="box bg-info mb-3 col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>Info</p>
            </div>
            <div class="box bg-warning mb-3 col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>Primary</p>
            </div>
            <div class="box bg-danger mb-3  col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>Primary</p>
            </div>
            <div class="box bg-dark mb-3 col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>Dark</p>
               
            </div>
             <div class="box bg-light mb-3 col-sm-12 col-md-12 col-lg-6 col-xl-4">
                <p>light</p>
            </div>
        </div>
    </div>
