<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="Todo-List.css" />
    <title>TodoList</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div  class="bg-container col-12">
                <h1 class="heading">ToDo List</h1>
                <div class="mb-3">
                    <input class="mb-3" type="text" id="inputSkill" style="width: 900px; height: 50px;" /> <br />
                    <button class="btn btn-primary" id="addSkill">Add</button>
                </div>
                <h1 class="task-List">My Tasks</h1>
                <div id="listTask" class="d-flex flex-row mt-3">  
                <input type="checkbox" class="my-checkbox" id="myTask" />
                <label for="myTask" class="skilss">Learn HTML</label>
                </div>  
            </div>
        </div>
    </div>
    <script type="text/javascript" src="Todo-List.js"></script>
</body>
</html>
