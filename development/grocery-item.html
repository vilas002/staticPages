<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery-List</title>
    <link rel="stylesheet" href="grocery-item.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

</head>
<body>
       <div class="bg-container">
        <h1 class="heading">Grocery List</h1>
        
        <ul class="grocery-card">
            <li>Milk</li>
            <li>Peanut Butter</li>
            <li>Choco Chips</li>
            <li>Tomato Sauce</li>
            <li>Cup Cakes</li>
            <li>Noodles</li>
        </ul>
        <input type="checkbox" id="deliveryMode"/>
        <label for="deliveryMode" class="delivery-text">Need Home Delivery</label>
        <br/><button class="btn btn-primary">Proceed To Pay</button>
    </div>
</body>
</html>
